# Ruff settings for CI and for local runs (`ruff check .`). The rule set is fixed here, so a new Ruff release
# does not add rules by surprise. runs/ holds the scripts as they ran: CI does not lint them.
target-version = "py310"
line-length = 120
extend-exclude = ["runs"]

[lint]
select = ["E4", "E7", "E9", "F"]

# The display-KV overlay and its tests use a compact style (one statement after a colon). The files stay
# as the author wrote them. Only the style rules for this folder are relaxed; the error rules stay on.
[lint.per-file-ignores]
"experiments/display-kv/**" = ["E401", "E701", "E702"]

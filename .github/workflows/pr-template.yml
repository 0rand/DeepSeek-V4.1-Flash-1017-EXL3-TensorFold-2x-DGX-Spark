# Checks the text of each pull request against CONTRIBUTING.md: exactly one ticked type and an AI disclosure block.
# It adds the matching "type: ..." label and removes other type labels, so fork pull requests get labels too.
# pull_request_target gives the token write access to labels. This workflow reads only the pull request text through
# the API. It never checks out or runs the code of the pull request: do not add a checkout step.
name: pr-template

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-template:
    name: pr-template
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Check type and AI disclosure, set the type label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            // Template hints are HTML comments: they are not answers.
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const types = ['fix', 'feature', 'docs', 'results', 'research', 'spec'];
            const ticked = types.filter((t) =>
              new RegExp('^\\s*[-*]\\s*\\[[xX]\\]\\s*`type: ' + t + '`', 'm').test(body));
            const problems = [];

            if (ticked.length !== 1) {
              problems.push(`Tick exactly one type in the "Type" section (now ticked: ${ticked.length}).`);
            } else {
              const want = `type: ${ticked[0]}`;
              const have = pr.labels.map((l) => l.name);
              for (const name of have.filter((n) => n.startsWith('type: ') && n !== want)) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name });
              }
              if (!have.includes(want)) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [want] });
              }
              core.info(`label: ${want}`);
            }

            const disclosure = /<summary>\s*AI disclosure\s*<\/summary>([\s\S]*?)<\/details>/i.exec(body);
            const ai = disclosure && /^\s*AI:\s*(.+)$/m.exec(disclosure[1]);
            if (!disclosure) {
              problems.push('Add the "AI disclosure" block at the bottom (see "AI disclosure" in CONTRIBUTING.md).');
            } else if (!ai || ai[1].includes('<model and size>')) {
              problems.push('Fill in the "AI:" line of the AI disclosure block, or write "AI: none".');
            }

            if (problems.length) {
              core.setFailed(problems.join('\n'));
            }

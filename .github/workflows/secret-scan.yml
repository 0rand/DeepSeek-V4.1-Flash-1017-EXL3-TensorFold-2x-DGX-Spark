# Secret scan for every pull request and every push to main. It runs gitleaks on the commits of the branch.
# tests/test_machine_values.py (ci.yml, job python) checks home paths and public IP addresses.
# Why pull_request_target: a pull_request workflow runs the workflow file from the pull request, so a pull request
# could replace the scan with a no-op and still pass the check. pull_request_target runs this file from the base
# branch, which a pull request cannot change. The pull request checkout is data only: no step runs code from it.
# The binary and its config stay in RUNNER_TEMP. The job name (secrets) is a required status check: if you rename
# the job, change the ruleset too.
name: secret-scan

on:
  # Safe here: the token is read-only, and no step runs code from the pull request (see the comment above).
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          printf '[extend]\nuseDefault = true\n' > gitleaks.toml
          mkdir -p no-ignore
      # The pull request head (or the pushed commit), as data for the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: scan
      # gitleaks also loads <source>/.gitleaksignore whatever --gitleaks-ignore-path says, so a pull request could
      # hide its own leak with one. The job refuses such a file.
      - name: Refuse a .gitleaksignore in the checkout
        run: |
          if [ -e scan/.gitleaksignore ]; then
            echo "::error file=.gitleaksignore::remove .gitleaksignore: the secret scan does not accept repo ignores"
            exit 1
          fi
      # --log-opts=HEAD: the commits of this branch only (the default is every branch).
      - name: gitleaks (all commits of this branch)
        run: >-
          "$RUNNER_TEMP/gitleaks" git scan --log-opts=HEAD --config "$RUNNER_TEMP/gitleaks.toml"
          --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" --redact --no-banner --exit-code 1

# Gives each new issue a type label. The issue forms add the label themselves, but an issue made with the API, the gh
# CLI or an agent skips the form and gets no label. This workflow reads the title prefix of the forms ([bug],
# [feature], [perf]) and adds the matching label. An issue with no known prefix gets "needs-triage".
# It adds labels. The only label it removes is its own "needs-triage", when a later title edit gives the type.
# It never changes a type label, so the maintainer can always set the type by hand.
# It reads only the issue title and labels through the API. It never checks out or runs code.
name: issue-labels

on:
  issues:
    # labeled: a maintainer who sets a type by hand also ends needs-triage. Labels that this workflow adds with
    # GITHUB_TOKEN do not start a new run, so there is no loop.
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write

# One run at a time for each issue, in order. Each run reads the current labels, so the last run decides.
concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  issue-labels:
    name: issue-labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.issue.user.type != 'Bot' && github.event.issue.pull_request == null
    steps:
      - name: Add the type label from the title prefix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Read the issue now, not the event snapshot: a title edit can come before an earlier run ends.
            const number = context.payload.issue.number;
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
            const have = issue.labels.map((l) => (typeof l === 'string' ? l : l.name));
            const dropTriage = async () => {
              if (have.includes('needs-triage')) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: number, name: 'needs-triage' });
                core.info('removed needs-triage');
              }
            };
            // The labels that say what kind of issue it is. If one is there, the issue has a type.
            const types = ['bug', 'enhancement', 'performance', 'question', 'documentation'];
            if (have.some((n) => types.includes(n))) {
              await dropTriage();
              return;
            }
            const prefixes = [
              [/^\s*\[\s*bug\s*\]/i, 'bug'],
              [/^\s*\[\s*(feature|feat)\s*\]/i, 'enhancement'],
              [/^\s*\[\s*(perf|performance)\s*\]/i, 'performance'],
            ];
            const hit = prefixes.find(([re]) => re.test(issue.title || ''));
            if (!hit) {
              if (!have.includes('needs-triage')) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: ['needs-triage'] });
              }
              core.info('label: needs-triage');
              return;
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: [hit[1]] });
            await dropTriage();                               // the title now gives the type
            core.info(`label: ${hit[1]}`);

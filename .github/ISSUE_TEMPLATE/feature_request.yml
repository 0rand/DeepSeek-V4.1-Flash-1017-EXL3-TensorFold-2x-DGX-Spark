name: Feature request
description: Propose a new feature or a change to the recipe.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. For a large change, agree on the plan here before you open a pull request. CONTRIBUTING.md gives the rules.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does the feature solve? Who has this problem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What do you want to change? Which files and settings does it touch?
    validations:
      required: true
  - type: dropdown
    id: default
    attributes:
      label: Default behaviour
      description: A new feature must be off by default, or it must have its own start script.
      options:
        - The feature is off by default. A user turns it on.
        - The feature has its own start script.
        - The feature changes a default (explain below)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and test plan
      description: How do you show that it works? For a speed claim, describe the A/B with identical settings (image, TF_DS_PREFILL_CHUNK, SPILL_GIB).
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions
      description: What other solutions did you think about?
